name: batch
# One-off: renders the 12 ready-made videos (one per new arena mode) and commits them to PAYLASILACAK/.
on:
  workflow_dispatch:
permissions: {contents: write}
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {n: "01", mode: maze, theme: countries}
          - {n: "02", mode: golf, theme: clubs}
          - {n: "03", mode: plinko, theme: ai}
          - {n: "04", mode: race, theme: countries}
          - {n: "05", mode: storm, theme: clubs}
          - {n: "06", mode: territory, theme: ai}
          - {n: "07", mode: sumo, theme: countries}
          - {n: "08", mode: tower, theme: clubs}
          - {n: "09", mode: chain, theme: ai}
          - {n: "10", mode: flip, theme: countries}
          - {n: "11", mode: pinball, theme: clubs}
          - {n: "12", mode: hole, theme: ai}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - run: pip install -q -r requirements.txt
      - name: render
        run: python src/run.py --mode ${{ matrix.mode }} --theme ${{ matrix.theme }} --render-to PAYLASILACAK_out --name ${{ matrix.n }}_${{ matrix.mode }}_${{ matrix.theme }}
      - uses: actions/upload-artifact@v4
        with: {name: "v${{ matrix.n }}", path: PAYLASILACAK_out/*, retention-days: 3}
  collect:
    needs: render
    if: always()
    runs-on: ubuntu-latest
    concurrency: {group: state, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: "v*", path: PAYLASILACAK, merge-multiple: true}
      - run: python src/mkqueue.py
      - name: commit
        run: |
          git config user.name "bounce-bot" && git config user.email "bot@users.noreply.github.com"
          git add PAYLASILACAK && git commit -qm "PAYLASILACAK: 12 ready-made videos" && git pull -q --rebase && git push -q
