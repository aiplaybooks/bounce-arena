name: post
on:
  schedule:
    # UTC slots: AU evening, UK lunch/US morning, US lunch, UK evening, US evening ET, US evening PT
    - cron: "30 9 * * *"
    - cron: "30 12 * * *"
    - cron: "0 16 * * *"
    - cron: "0 19 * * *"
    - cron: "30 22 * * *"
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run: {type: boolean, default: true, description: "render only, do not publish"}
      preview: {type: boolean, default: false, description: "3 PNG stills only"}
      mode: {type: string, default: "", description: "escape|grow (empty = strategy)"}
      theme: {type: string, default: "", description: "theme name from strategy (empty = strategy)"}
      only: {type: string, default: "", description: "ig|fb (empty = both)"}
concurrency: {group: state, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - run: pip install -q -r requirements.txt
      - name: run
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ]; then ARGS="--queue-first"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.preview }}" = "true" ]; then ARGS="$ARGS --preview"; fi
          if [ -n "${{ inputs.mode }}" ]; then ARGS="$ARGS --mode ${{ inputs.mode }}"; fi
          if [ -n "${{ inputs.theme }}" ]; then ARGS="$ARGS --theme ${{ inputs.theme }}"; fi
          if [ -n "${{ inputs.only }}" ]; then ARGS="$ARGS --only ${{ inputs.only }}"; fi
          python src/run.py $ARGS
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: out, path: "out/*.mp4\nout/preview/*.png", retention-days: 5, if-no-files-found: ignore}
      - name: commit state
        if: always()
        run: |
          git config user.name "bounce-bot" && git config user.email "bot@users.noreply.github.com"
          git add state; git add -A "BOUNCE ARENA" 2>/dev/null || true; (git diff --cached --quiet || (git commit -qm "state: post" && git pull -q --rebase && git push -q))
