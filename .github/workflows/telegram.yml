name: telegram
on:
  repository_dispatch:
    types: [telegram]
concurrency: {group: telegram, cancel-in-progress: false}
permissions: {contents: write, actions: write}
jobs:
  chat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: npm install -g -s @anthropic-ai/claude-code
      - run: pip install -q requests==2.32.3
      - name: agent
        env:
          MSG: ${{ github.event.client_payload.text }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "bounce-bot" && git config user.email "bot@users.noreply.github.com"
          python src/tg_agent.py
